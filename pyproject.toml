[project]
name = "jit-ddt"
version = "0.1.0"
description = "JiT-DDT: a pixel-space text-to-image diffusion transformer (encoder + decoder DiT) by Linum"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.10",
    "transformers>=5.5",
    "safetensors>=0.5",
    "huggingface_hub>=0.30",
    "numpy",
    "pillow",
    "tqdm",
]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jit_ddt"]
